[package]
name = "zellij-flash"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Zellij plugin: flash-style scrollback selection and copy"

[[bin]]
name = "zellij_flash"
path = "src/main.rs"

[dependencies]
zellij-tile = "0.44.3"
ratatui = { version = "0.29", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
